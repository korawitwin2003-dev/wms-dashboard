<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ไอซ์ คลังเก็บสินค้า - WMS Dashboard 3D</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --panel-bg: #121212;
            --border-color: #2a2a2a;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent-white: #ffffff;
            --accent-gray: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: 280px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            z-index: 10;
        }

        .brand {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .menu-item {
            padding: 12px 16px;
            margin-bottom: 8px;
            border-radius: 4px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-item:hover, .menu-item.active {
            background-color: var(--accent-gray);
            color: var(--text-main);
        }

        #main-content {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            background-color: #050505;
        }

        #info-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 320px;
            background-color: rgba(18, 18, 18, 0.9);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .panel-header {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-card {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #252525;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 4px;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .btn {
            width: 100%;
            padding: 10px;
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 10px;
        }

        .btn:hover {
            opacity: 0.9;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--text-muted);
            font-size: 0.9rem;
            letter-spacing: 1px;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="sidebar">
        <div class="brand">คลังสินค้า 3D</div>
        <div class="menu-item active">ผังคลัง 3D</div>
        <div class="menu-item">รายการสินค้า</div>
        <div class="menu-item">บันทึกรับ-จ่าย</div>
        <div class="menu-item">รายงาน/สถิติ</div>
    </div>

    <div id="main-content">
        <div id="canvas-container"></div>
        <div id="loading">กำลังเชื่อมต่อ Google Sheets...</div>

        <div id="info-panel">
            <div class="panel-header" id="warehouse-name">เลือกอาคาร/คลังสินค้า</div>
            <div class="stat-grid">
                <div class="stat-card">
                    <div class="stat-label">รายการทั้งหมด</div>
                    <div class="stat-value" id="total-items">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">จำนวนรวม</div>
                    <div class="stat-value" id="total-qty">0</div>

            </div>
            <div style="font-size: 0.85rem; color: #aaa; margin-bottom: 10px;">

            </div>
            <button class="btn" onclick="fetchSheetData()">รีเฟรชข้อมูลชีต</button>
        </div>
    </div>
