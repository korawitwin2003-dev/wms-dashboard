<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ไอซ์ คลังเก็บสินค้า - WMS Dashboard 3D</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --panel-bg: #121212;
            --border-color: #2a2a2a;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent-gray: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: 280px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            z-index: 10;
        }

        .brand {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .menu-item {
            padding: 12px 16px;
            margin-bottom: 8px;
            border-radius: 4px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s ease;
        }

        .menu-item:hover, .menu-item.active {
            background-color: var(--accent-gray);
            color: var(--text-main);
        }

        #main-content {
            flex: 1;
            position: relative;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            background-color: #050505;
        }

        #info-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 320px;
            background-color: rgba(18, 18, 18, 0.9);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .panel-header {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-card {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #252525;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 4px;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .btn {
            width: 100%;
            padding: 10px;
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:hover {
            opacity: 0.9;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="sidebar">
        <div class="brand">ไอซ์ คลังเก็บสินค้า</div>
        <div class="menu-item active">ผังคลัง 3D</div>
        <div class="menu-item">รายการสินค้า</div>
        <div class="menu-item">บันทึกรับ-จ่าย</div>
        <div class="menu-item">รายงาน/สถิติ</div>
    </div>

    <div id="main-content">
        <div id="canvas-container"></div>
        <div id="loading">กำลังเชื่อมต่อ Google Sheets...</div>

        <div id="info-panel">
            <div class="panel-header" id="warehouse-name">เลือกอาคาร/คลังสินค้า</div>
            <div class="stat-grid">
                <div class="stat-card">
                    <div class="stat-label">รายการทั้งหมด</div>
                    <div class="stat-value" id="total-items">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">จำนวนรวม</div>
                    <div class="stat-value" id="total-qty">0</div>
                </div>
            </div>
            <div style="font-size: 0.85rem; color: #aaa; margin-bottom: 10px;">
                สถานะเชื่อมต่อ: <span id="sync-status" style="color: #00ff00;">พร้อมใช้งาน</span>
            </div>
            <button class="btn" onclick="fetchSheetData()">รีเฟรชข้อมูลชีต</button>
        </div>
    </div>

    <script>
        // นำ URL Web App จาก Step 2 มาวางตรงนี้
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyTa4qBlc2BnfHglJr_WzalCJS2vRd7h7bv6zbB8lb29LgwoQzHs6aZRCiVkCgPRrLr9w/exec';

        let sheetData = [];

        async function fetchSheetData() {
            const statusEl = document.getElementById('sync-status');
            const loadingEl = document.getElementById('loading');
            statusEl.innerText = 'กำลังโหลด...';
            statusEl.style.color = '#ffff00';

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL);
                sheetData = await response.json();
                
                document.getElementById('total-items').innerText = sheetData.length;
                
                let totalQty = 0;
                sheetData.forEach(item => {
                    const qty = item.Quantity || item.quantity || 0;
                    totalQty += Number(qty);
                });
                document.getElementById('total-qty').innerText = totalQty;

                statusEl.innerText = 'เชื่อมต่อสำเร็จ';
                statusEl.style.color = '#00ff00';
                loadingEl.style.display = 'none';
            } catch (err) {
                console.error("Error fetching data: ", err);
                statusEl.innerText = 'ผิดพลาดในการโหลด';
                statusEl.style.color = '#ff0000';
                loadingEl.innerText = 'เชื่อมต่อ Google Sheets ไม่สำเร็จ';
            }
        }

        // --- Three.js 3D Scene ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);

        const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(30, 25, 35);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const gridHelper = new THREE.GridHelper(60, 30, 0x444444, 0x222222);
        scene.add(gridHelper);

        const buildings = [];
        const buildingPositions = [
            { id: 1, name: "คลังสินค้า A1", x: -15, z: -10, w: 12, d: 15, h: 8 },
            { id: 2, name: "คลังสินค้า A2", x: 15, z: -10, w: 12, d: 15, h: 8 },
            { id: 3, name: "คลังสินค้า B1", x: -15, z: 12, w: 12, d: 15, h: 8 },
            { id: 4, name: "คลังสินค้า B2", x: 15, z: 12, w: 12, d: 15, h: 8 }
        ];

        buildingPositions.forEach(pos => {
            const geometry = new THREE.BoxGeometry(pos.w, pos.h, pos.d);
            const material = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.4, metalness: 0.1 });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(pos.x, pos.h / 2, pos.z);
            mesh.userData = pos;

            const edges = new THREE.EdgesGeometry(geometry);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffffff }));
            mesh.add(line);

            scene.add(mesh);
            buildings.push(mesh);
        });

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / container.clientWidth) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / container.clientHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(buildings);

            if (intersects.length > 0) {
                const selected = intersects[0].object;
                buildings.forEach(b => b.material.color.setHex(0x222222));
                selected.material.color.setHex(0x444444);
                document.getElementById('warehouse-name').innerText = selected.userData.name;
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        fetchSheetData();
    </script>
</body>
</html>
